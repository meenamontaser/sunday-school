<h3>🎂 رسالة عيد الميلاد</h3><div class=card><textarea id=bg>${esc(U.bmsg||BM)}</textarea><small>اكتب {الاسم} مكان اسم المخدوم</small><button class=pri onclick="sg()">💾 حفظ رسالة العيد</button></div>
<h3>🎂 أعياد ميلاد شهر ${mo.slice(5)} (${bl.length})</h3>${bl.map(m=>`<div class=card><b>${esc(m.name)}</b> <small>${m.cls}</small><br>🎂 ${esc(fb(m.birth))}<br>${bb(m,by)}</div>`).join('')||'<p>لا يوجد (أو كله اتبعتله ✅)</p>'}${bl0.length>bl.length?`<small>✅ اتبعت لـ ${bl0.length-bl.length} <a onclick="ub('${mo}')" style="color:#c0392b;cursor:pointer">↩ رجّعهم للقائمة</a></small>`:''}`},
les(){const x=Object.values(D.l).filter(x=>(!cur||x.cls==cur)&&(x.title||x.verse)).sort((a,b)=>b.date.localeCompare(a.date)||CL.indexOf(a.cls)-CL.indexOf(b.cls));
return x.map(x=>`<div class=card><b>${x.cls}</b> <small>${x.date}</small><br>📖 ${esc(x.title)}<br>✝ ${esc(x.verse)}<br><button onclick="el('${x.cls}_${x.date}')">✏ تعديل</button><button class=del onclick="dl('${x.cls}_${x.date}')">🗑 مسح</button></div>`).join('')||'<p>لسه مفيش دروس مسجلة</p>'},
usr(){return `<div class=card><b>اسم المطرانية والكاتدرائية</b><input id=b_a value="${esc(BRD.a)}"><input id=b_b value="${esc(BRD.b)}"><button class=pri onclick="sb()">💾 حفظ الاسم</button></div><div class=card><input id=u_n placeholder="اسم الخادم" value="${esc(EU&&EU.name)}"><input id=u_p placeholder="الرقم السري" inputmode=numeric value="${esc(EU&&EU.pin)}"><input id=u_ph type=tel placeholder="رقم موبايل الخادم (واتساب)" value="${esc(EU&&EU.phone)}">
<select id=u_c><option value="admin">أمين خدمة (كل المراحل)</option>${opts(EU&&EU.cls)}</select><button class=pri onclick="au()">${EU?'💾 حفظ التعديل':'+ إضافة'}</button>${EU?'<button onclick="EU=null;r()">إلغاء</button>':''}</div>`+
D.u.map(u=>`<div class=card>${esc(u.name)} — ${u.role=='admin'?'أمين الخدمة':u.cls}<br><small>الرقم السري: ${esc(u.pin)} | 📞 ${esc(u.phone||'-')}</small> <button onclick="eu('${u.id}')">✏ تعديل</button> ${u.id==U.id?'':`<button class=del onclick="du('${u.id}')">حذف</button>`}</div>`).join('')}};
function tg(id,el){P[id]=!P[id];el.classList.toggle('ok');el.lastChild.textContent=P[id]?'حاضر ✓':'غائب'}
async function sv(){const k=cur+'_'+dt;await db.collection('att').doc(k).set({cls:cur,date:dt,p:P});
await db.collection('lessons').doc(k).set({cls:cur,date:dt,title:$('lt').value,verse:$('lv').value});D.a[k]={cls:cur,date:dt,p:{...P}};D.l[k]={cls:cur,date:dt,title:$('lt').value,verse:$('lv').value};alert('تم الحفظ ✅');r()}
function ml(){const s=q.trim();return vis().filter(m=>!s||Object.values(m).join(' ').includes(s)).map(m=>
`<div class=card onclick="E=D.m.find(x=>x.id=='${m.id}');r()"><b>${esc(m.name)}</b> <small>${m.cls}</small><br>📞 ${esc(m.phone)} | 🏠 ${esc(m.addr)}<br>أب الاعتراف: ${esc(m.father||'-')} ${m.deacon=='نعم'?'| شماس':''} ${m.scout=='نعم'?'| كشافة':''} ${m.birth?'| 🎂 '+esc(fb(m.birth)):''} ${m.stay=='نعم'?'| 🔁 يعيد السنة':''}</div>`).join('')||'<p>لا نتائج</p>'}
function form(){const A=U.role=='admin',c=E.cls||(A?cur:U.cls),co=A?opts(c):(E.id?[c,prv(c)]:[c]).filter(Boolean).map(k=>`<option ${k==c?'selected':''}>${k}</option>`).join(''),f=(i,p,t='')=>`<input id=f_${i} ${t} placeholder="${p}" value="${esc(E[i])}">`,yn=k=>`<select id=f_${k}><option>لا</option><option ${E[k]=='نعم'?'selected':''}>نعم</option></select>`;
return `<div class=card>${f('name','الاسم')}<select id=f_cls>${co}</select>${f('addr','العنوان')}${f('phone','رقم الموبايل','type=tel')}${f('father','أب الاعتراف')}<small>🎂 تاريخ الميلاد</small>${bsel(E.birth)}
شماس؟ ${yn('deacon')} كشافة؟ ${yn('scout')}<br>يعيد السنة؟ (مايتنقلش في الترحيل) ${yn('stay')}<button class=pri onclick="svm()">حفظ</button>${E.id?'<button class=del onclick="dm()">حذف</button>':''}<button onclick="E=null;r()">إلغاء</button></div>`}
async function svm(){const A=U.role=='admin',d={name:$('f_name').value.trim(),cls:$('f_cls').value,addr:$('f_addr').value,phone:$('f_phone').value,father:$('f_father').value,birth:gb(),deacon:$('f_deacon').value,scout:$('f_scout').value,stay:$('f_stay').value};
if(!d.name)return alert('اكتب الاسم');await db.collection('members').doc(E.id||db.collection('members').doc().id).set(d);E=null;await load();r()}
async function dm(){if(!confirm('تحذف المخدوم؟'))return;await db.collection('members').doc(E.id).delete();E=null;await load();r()}
async function au(){const n=$('u_n').value.trim(),p=$('u_p').value.trim(),c=$('u_c').value;if(!n||!p)return alert('اكمل البيانات');
const self=EU&&EU.id==U.id,d={name:n,pin:p,phone:$('u_ph').value.trim(),role:self||c=='admin'?'admin':'servant',cls:self||c=='admin'?'':c};
if(EU){await db.collection('users').doc(EU.id).update(d);if(self){U.name=n;U.pin=p;U.phone=d.phone}}else await db.collection('users').add(d);EU=null;await load();r()}
function eu(id){EU=D.u.find(x=>x.id==id);r()}
async function da(){if(!confirm('تمسح حضور ودرس اليوم ده؟'))return;const k=cur+'_'+dt;await db.collection('att').doc(k).delete();await db.collection('lessons').doc(k).delete();delete D.a[k];delete D.l[k];P={};r()}
const ll=()=>Object.values(D.l).filter(x=>x.cls==cur&&(x.title||x.verse)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(x=>`<div class=card><small>${x.date}</small> 📖 ${esc(x.title)} — ✝ ${esc(x.verse)}</div>`).join('')||'<p>لسه مفيش دروس</p>';
async function sl(){const k=cur+'_'+dt,d={cls:cur,date:dt,title:$('lt').value,verse:$('lv').value};await db.collection('lessons').doc(k).set(d);D.l[k]=d;alert('تم حفظ الدرس ✅');r()}
function el(k){const x=D.l[k];cur=x.cls;dt=x.date;T='att';openAtt();r()}
async function dl(k){if(!confirm('تمسح الدرس ده؟'))return;await db.collection('lessons').doc(k).delete();delete D.l[k];r()}
async function sb(){BRD={a:$('b_a').value.trim(),b:$('b_b').value.trim()};await db.collection('settings').doc('brand').set(BRD);alert('تم الحفظ ✅');r()}
async function sm(){U.msg=$('mg').value;await db.collection('users').doc(U.id).update({msg:U.msg});alert('تم حفظ رسالتك ✅')}
async function sg(){U.bmsg=$('bg').value;await db.collection('users').doc(U.id).update({bmsg:U.bmsg});alert('تم حفظ رسالة العيد ✅')}
async function pr(){if(!confirm('تنفّذ ترحيل كل المراحل للسنة الجديدة؟ (تقدر تتراجع بعدها)'))return;
const gs=($('gs')||{}).value,mv=D.m.map(m=>{const g=m.cls=='أولى'?($('g_'+m.id)||{}).value:'';return{id:m.id,from:m.cls,to:m.stay=='نعم'||(m.cls.startsWith('سادسة')&&gs=='stay')?m.cls:nxt(m,g),g}}).filter(x=>x.to!=x.from);
for(let i=0;i<mv.length;i+=400){const b=db.batch();mv.slice(i,i+400).forEach(x=>b.update(db.collection('members').doc(x.id),x.g?{cls:x.to,g:x.g}:{cls:x.to}));await b.commit()}
const kp=D.m.filter(m=>m.stay=='نعم').map(m=>m.id);for(const id of kp)await db.collection('members').doc(id).update({stay:'لا'});
await db.collection('settings').doc('promo').set({date:today(),kept:kp,moves:mv.map(x=>({id:x.id,from:x.from}))});
await load();alert('تم الترحيل ✅ ('+mv.length+' مخدوم)');r()}
async function un(){if(!D.pm||!confirm('ترجع المراحل زي ما كانت قبل آخر ترحيل؟'))return;const mv=D.pm.moves.filter(x=>D.m.some(m=>m.id==x.id));
for(let i=0;i<mv.length;i+=400){const b=db.batch();mv.slice(i,i+400).forEach(x=>b.update(db.collection('members').doc(x.id),{cls:x.from}));await b.commit()}
for(const id of (D.pm.kept||[]).filter(id=>D.m.some(m=>m.id==id)))await db.collection('members').doc(id).update({stay:'نعم'});
await db.collection('settings').doc('promo').delete();D.pm=null;await load();alert('تم التراجع ✅');r()}
function gx(a){const o=cur;cur='خريجين';try{a=='p'?pw():sh('ros','')}finally{cur=o}}
async function dg(){const l=D.m.filter(m=>m.cls=='خريجين');if(!l.length)return alert('لا يوجد خريجين');if(!confirm('تمسح كل الخريجين ('+l.length+') نهائياً؟ اطبع أو ابعت الكشف الأول.'))return;for(let i=0;i<l.length;i+=400){const b=db.batch();l.slice(i,i+400).forEach(m=>b.delete(db.collection('members').doc(m.id)));await b.commit()}await load();alert('تم المسح ✅');r()}
function mk(id,dd){const m=D.m.find(x=>x.id==id);if(!m)return;const k=id+'_'+dd;D.s[k]={id,cls:m.cls,date:dd,by:U.name};db.collection('sent').doc(k).set(D.s[k]);setTimeout(r,400)}
async function ua(dd){const ks=Object.keys(D.s).filter(k=>D.s[k].date==dd&&(!cur||D.s[k].cls==cur));for(const k of ks){await db.collection('sent').doc(k).delete();delete D.s[k]}r()}
function mw(id,mo){const m=D.m.find(x=>x.id==id);if(!m)return;const k=id+'_w4_'+mo;D.s[k]={id,cls:m.cls,date:mo,kind:'w4',by:U.name};db.collection('sent').doc(k).set(D.s[k]);r()}
async function uw(mo){const ks=Object.keys(D.s).filter(k=>k.endsWith('_w4_'+mo)&&(!cur||D.s[k].cls==cur));for(const k of ks){await db.collection('sent').doc(k).delete();delete D.s[k]}r()}
function mb(id,y){const m=D.m.find(x=>x.id==id);if(!m)return;const k=id+'_b_'+y;D.s[k]={id,cls:m.cls,date:y,kind:'b',by:U.name};db.collection('sent').doc(k).set(D.s[k]);setTimeout(r,400)}
async function ub(mo){const y=mo.slice(0,4);for(const m of vis().filter(m=>m.birth&&m.birth.slice(5,7)==mo.slice(5))){const k=m.id+'_b_'+y;if(D.s[k]){await db.collection('sent').doc(k).delete();delete D.s[k]}}r()}
async function um(id,dd){const k=id+'_'+dd;await db.collection('sent').doc(k).delete();delete D.s[k];r()}
async function du(id){if(!confirm('تحذف الخادم؟'))return;await db.collection('users').doc(id).delete();await load();r()}
init();
</script></body></html>
